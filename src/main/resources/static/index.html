<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>交易位信号系统</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/vendor/index.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="app">
  <!-- 认证遮罩：默认登录页（用户名+密码 / 访问密钥），「立即注册」切注册页，注册成功跳回登录 -->
  <div v-if="!authed" class="auth-overlay">
    <div class="auth-toast" v-if="toast.text" :class="toast.type">{{ toast.text }}</div>
    <div class="auth-card">
      <div class="auth-logo">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none">
          <path d="M12 2l2.4 7.2H22l-6 4.6 2.3 7.2-6.3-4.5-6.3 4.5L8 13.8l-6-4.6h7.6z" fill="#3b9eff"/>
        </svg>
      </div>
      <div class="auth-title">交易位信号系统</div>
      <div class="auth-sub">TRADE SIGNAL</div>

      <!-- 登录页 -->
      <template v-if="authView === 'login'">
        <template v-if="!useKey">
          <div class="auth-field"><input v-model="loginForm.username" placeholder="用户名" autocomplete="off" :disabled="authLoading" @keyup.enter="login"></div>
          <div class="auth-field"><input v-model="loginForm.password" type="password" placeholder="密码" :disabled="authLoading" @keyup.enter="login"></div>
        </template>
        <div v-else class="auth-field"><input v-model="authKey" type="password" placeholder="请输入访问密钥" :disabled="authLoading" @keyup.enter="login"></div>
        <button class="auth-btn" :disabled="authLoading" @click="login">{{ authLoading ? '登录中…' : '进 入' }}</button>
        <div class="auth-switch">
          <template v-if="!useKey">还没有账号？<a @click="authView = 'register'">立即注册</a> · <a @click="useKey = true">访问密钥</a></template>
          <a v-else @click="useKey = false">使用用户名登录</a>
        </div>
      </template>

      <!-- 注册页 -->
      <template v-else>
        <div class="auth-field"><input v-model="registerForm.username" placeholder="用户名（3-20 位字母/数字/下划线）" autocomplete="off" :disabled="authLoading" @keyup.enter="register"></div>
        <div class="auth-field"><input v-model="registerForm.password" type="password" placeholder="密码（8-64 位）" :disabled="authLoading" @keyup.enter="register"></div>
        <div class="auth-field"><input v-model="registerForm.inviteCode" placeholder="邀请码" autocomplete="off" :disabled="authLoading" @keyup.enter="register"></div>
        <button class="auth-btn" :disabled="authLoading" @click="register">{{ authLoading ? '注册中…' : '注 册' }}</button>
        <div class="auth-switch">已有账号？<a @click="authView = 'login'">返回登录</a></div>
      </template>
    </div>
  </div>

  <!-- 顶部工具区 -->
  <div class="toolbar">
    <div class="period-btns">
      <el-radio-group v-model="kdjType" size="large">
        <el-radio-button value="0">日线</el-radio-button>
        <el-radio-button value="1">周线</el-radio-button>
        <el-radio-button value="2">月线</el-radio-button>
        <el-radio-button value="3">季线</el-radio-button>
      </el-radio-group>
    </div>

    <div class="selector-row">
      <span class="label">截止周期</span>

      <el-date-picker
        v-if="kdjType === '0'"
        v-model="dailyDate"
        type="date"
        format="YYYY/MM/DD"
        value-format="YYYYMMDD"
        placeholder="选择交易日"
        :disabled-date="isNotTradeDate"
        :clearable="false"
      ></el-date-picker>

      <el-select v-if="kdjType === '1'" v-model="weekValue" placeholder="选择周" style="width: 280px">
        <el-option
          v-for="w in periods"
          :key="w.tradeDateMin"
          :label="fmtSlash(w.tradeDateMin) + ' - ' + fmtSlash(w.tradeDateMax)"
          :value="w.tradeDateMin + '-' + w.tradeDateMax"
        ></el-option>
      </el-select>

      <el-date-picker
        v-if="kdjType === '2'"
        v-model="monthValue"
        type="month"
        format="YYYY/MM"
        value-format="YYYYMM"
        placeholder="选择月份"
        :disabled-date="monthDisabled"
        :clearable="false"
      ></el-date-picker>

      <template v-if="kdjType === '3'">
        <el-select v-model="quarterYear" placeholder="年份" style="width: 120px">
          <el-option v-for="y in yearOptions" :key="y" :label="y + '年'" :value="y"></el-option>
        </el-select>
        <el-radio-group v-model="quarter">
          <el-radio-button value="1" :disabled="quarterDisabled(1)">第一季度</el-radio-button>
          <el-radio-button value="2" :disabled="quarterDisabled(2)">第二季度</el-radio-button>
          <el-radio-button value="3" :disabled="quarterDisabled(3)">第三季度</el-radio-button>
          <el-radio-button value="4" :disabled="quarterDisabled(4)">第四季度</el-radio-button>
        </el-radio-group>
      </template>

      <el-button type="primary" plain icon="Setting" @click="paramOpen = !paramOpen">
        参数设置
      </el-button>
      <el-button type="primary" icon="Search" :loading="querying" @click="loadLists">查询</el-button>
    </div>

    <!-- 参数面板：内嵌展开，非弹窗；默认值与后端一致 -->
    <el-collapse-transition>
      <div v-show="paramOpen" class="param-panel">
        <el-form inline label-width="170px" size="default">
          <el-divider content-position="left">KDJ 参数</el-divider>
          <el-form-item label="N（RSV 窗口）">
            <el-input-number v-model="params.n" :min="1" style="width: 140px"></el-input-number>
          </el-form-item>
          <el-form-item label="M1（K 平滑）">
            <el-input-number v-model="params.m1" :min="1" style="width: 140px"></el-input-number>
          </el-form-item>
          <el-form-item label="M2（D 平滑）">
            <el-input-number v-model="params.m2" :min="1" style="width: 140px"></el-input-number>
          </el-form-item>

          <el-divider content-position="left">信号限制项</el-divider>
          <el-form-item label="上次金叉交汇上限">
            <el-input-number v-model="params.lastGoldCrossMax" style="width: 140px"></el-input-number>
          </el-form-item>
          <el-form-item label="当前金叉交汇上限">
            <el-input-number v-model="params.currGoldCrossMax" style="width: 140px"></el-input-number>
          </el-form-item>
          <el-form-item label="死叉交汇上限">
            <el-input-number v-model="params.lastDeathCrossMax" style="width: 140px"></el-input-number>
          </el-form-item>
          <el-form-item label="金叉最小间距">
            <el-input-number v-model="params.goldInternalMin" :min="1" style="width: 140px"></el-input-number>
          </el-form-item>
          <el-form-item label="金叉最大间距">
            <el-input-number v-model="params.goldInternalMax" :min="1" style="width: 140px"></el-input-number>
          </el-form-item>
          <el-form-item label="收盘价更低（开关）">
            <el-switch v-model="params.openClosePriceLimit"></el-switch>
          </el-form-item>
          <el-form-item label="交汇点更高（开关）">
            <el-switch v-model="params.goldCrossLimit"></el-switch>
          </el-form-item>

          <el-divider content-position="left">行情口径</el-divider>
          <el-form-item label="复权类型">
            <el-radio-group v-model="params.adjust">
              <el-radio-button value="1">前复权</el-radio-button>
              <el-radio-button value="2">后复权</el-radio-button>
              <el-radio-button value="0">不复权</el-radio-button>
            </el-radio-group>
          </el-form-item>
        </el-form>
      </div>
    </el-collapse-transition>
  </div>

  <!-- 所有股票：始终展示全部列（无列设置），min-width 自适应填满整行 -->
  <el-card class="all-card" shadow="never" v-loading="loadingAll">
    <template #header>
      <div class="card-head">
        <span>所有股票（{{ allStockList.length }}）</span>
      </div>
    </template>
    <el-table ref="allTable" :data="allStockList" size="small" highlight-current-row
              height="420"
              @current-change="row => onSelect(row, 'all')"
              :row-class-name="() => 'clickable-row'">
      <el-table-column v-for="col in allColumns" :key="col.prop"
                       :prop="col.prop" :label="col.label" :min-width="col.minWidth"
                       :formatter="col.fmt ? fmtNum : undefined"
                       :align="col.prop === 'code' || col.prop === 'name' ? 'left' : 'right'"></el-table-column>
    </el-table>
  </el-card>

  <!-- 金叉 / 交易位 两个列表：列可勾选；三表选中互斥 -->
  <div class="lists">
    <el-card class="list-card" shadow="never" v-loading="loadingGold">
      <template #header>
        <div class="card-head">
          <span>金叉股票（{{ goldCrossList.length }}）</span>
          <el-popover placement="bottom-end" :width="160" trigger="click">
            <template #reference>
              <el-button size="small" text icon="Operation">列设置</el-button>
            </template>
            <el-checkbox-group v-model="goldCols" class="col-checks">
              <el-checkbox v-for="c in allColumns" :key="c.prop" :value="c.prop">{{ c.label }}</el-checkbox>
            </el-checkbox-group>
          </el-popover>
        </div>
      </template>
      <el-table ref="goldTable" :data="goldCrossList" size="small" highlight-current-row
                height="300"
                @current-change="row => onSelect(row, 'gold')"
                :row-class-name="() => 'clickable-row'">
        <el-table-column v-for="col in visibleGoldCols" :key="col.prop"
                         :prop="col.prop" :label="col.label" :width="col.width"
                         :formatter="col.fmt ? fmtNum : undefined"
                         :align="col.prop === 'code' || col.prop === 'name' ? 'left' : 'right'"></el-table-column>
      </el-table>
    </el-card>

    <el-card class="list-card" shadow="never" v-loading="loadingSignal">
      <template #header>
        <div class="card-head">
          <span>交易位股票（{{ tradeSignalList.length }}）</span>
          <el-popover placement="bottom-end" :width="160" trigger="click">
            <template #reference>
              <el-button size="small" text icon="Operation">列设置</el-button>
            </template>
            <el-checkbox-group v-model="signalCols" class="col-checks">
              <el-checkbox v-for="c in allColumns" :key="c.prop" :value="c.prop">{{ c.label }}</el-checkbox>
            </el-checkbox-group>
          </el-popover>
        </div>
      </template>
      <el-table ref="signalTable" :data="tradeSignalList" size="small" highlight-current-row
                height="300"
                @current-change="row => onSelect(row, 'signal')"
                :row-class-name="() => 'clickable-row'">
        <el-table-column v-for="col in visibleSignalCols" :key="col.prop"
                         :prop="col.prop" :label="col.label" :width="col.width"
                         :formatter="col.fmt ? fmtNum : undefined"
                         :align="col.prop === 'code' || col.prop === 'name' ? 'left' : 'right'"></el-table-column>
      </el-table>
    </el-card>
  </div>

  <!-- 价格走势 + KDJ 联动图 -->
  <el-card v-if="chartStock" class="chart-card" shadow="never" v-loading="loadingChart">
    <template #header>
      <div class="chart-head">
        <span>{{ chartStock.code }}<template v-if="chartStock.name">&nbsp;{{ chartStock.name }}</template>&nbsp;&nbsp;价格走势 / KDJ</span>
        <span class="period">{{ periodName }}</span>
      </div>
    </template>
    <div id="kdjChart"></div>
  </el-card>
</div>

<script src="/vendor/vue.global.prod.js"></script>
<script src="/vendor/index.full.min.js"></script>
<script src="/vendor/zh-cn.min.js"></script>
<script src="/vendor/echarts.min.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
