<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>板块设置最终版原型 — 交易位信号系统</title>
<!--
  原型（final）：板块设置样式定稿 = 第一版（原生勾选框 + 9px 徽标 + 14px 文字），不带股票数；
  「参数设置」仅按钮显示与板块设置统一（plain 文字按钮），点击后仍展开原有内嵌面板（与现网一致，不做弹层）。
  交互口径：纯前端过滤（boardType），不传后端；全选 = 不过滤。
  演示规则：mock 数据，不接后端。
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f2f4f8; color: #303133; }
  button { cursor: pointer; border: none; background: none; font-family: inherit; }

  #page { max-width: 1280px; margin: 0 auto; padding: 20px 24px 60px; }

  .intro { background: #fff; border: 1px solid #e4e7ed; border-radius: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,.05); padding: 14px 20px; margin-bottom: 14px; font-size: 13px; color: #606266; }
  .intro b { color: #303133; }

  .toolbar { background: #fff; border: 1px solid #e4e7ed; border-radius: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,.05); padding: 14px 20px; margin-bottom: 16px; }
  .nav-underline { display: flex; justify-content: center; gap: 36px; border-bottom: 1px solid #e4ebf3; margin-bottom: 14px; }
  .nav-underline a { position: relative; padding: 6px 2px 10px; font-size: 15px; color: #7a93b0; cursor: pointer; text-decoration: none; }
  .nav-underline a.on { color: #1a3a5c; font-weight: 600; }
  .nav-underline a.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: #2b8fe8; border-radius: 2px; }

  .selector-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .search { height: 32px; border: 1px solid #dcdfe6; border-radius: 4px; padding: 0 10px; font-size: 14px; background: #fff; width: 200px; }
  .btn { height: 32px; padding: 0 16px; border-radius: 4px; font-size: 14px; }
  .btn-plain { border: 1px solid #409eff; color: #409eff; background: #fff; }
  .btn-primary { background: #409eff; color: #fff; }

  /* 板块设置 popover（定稿：原生勾选框 + 9px 徽标 + 14px 文字，无股票数） */
  .pop-wrap { position: relative; }
  .pop { position: absolute; top: 40px; left: 0; z-index: 200; width: 230px;
    background: #fff; border: 1px solid #e4e7ed; border-radius: 8px;
    box-shadow: 0 8px 28px rgba(30,60,120,.14); padding: 12px 16px; }
  .pop[hidden] { display: none; }
  .pop-head { font-weight: 600; color: #303133; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
  .pop-head .quick { font-size: 12px; color: #409eff; cursor: pointer; font-weight: 400; }
  .opt { display: flex; align-items: center; gap: 9px; padding: 5px 0; cursor: pointer; user-select: none; font-size: 14px; }
  .opt input { width: 16px; height: 16px; accent-color: #409eff; cursor: pointer; margin: 0; }
  .empty-tip { color: #909399; font-size: 12px; margin-top: 8px; }

  /* 徽标（线上一致：border-box 15×14 / 9px 字） */
  .x-badge { box-sizing: border-box; display: inline-block; min-width: 15px; height: 14px; line-height: 14px;
    padding: 0 3px; border-radius: 3px; font-size: 9px; font-weight: 600; text-align: center;
    color: #fff; vertical-align: 2px; }
  .x-0 { background: #1f5fa8; } .x-1 { background: #2e9e5b; } .x-2 { background: #e8852e; }
  .x-3 { background: #7d5bc6; } .x-4 { background: #c93c3c; }

  /* 参数设置：按钮与板块设置同款，点开仍是原内嵌面板（简版示意，与现网一致） */
  .param-panel { margin-top: 12px; border-top: 1px dashed #dcdfe6; padding-top: 12px; font-size: 13px; color: #606266; width: 100%; }
  .param-panel[hidden] { display: none; }
  .param-sec { font-weight: 600; color: #909399; margin: 10px 0 6px; font-size: 13px; }
  .param-sec:first-child { margin-top: 0; }
  .prow { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .prow label { width: 160px; color: #606266; font-size: 13px; }
  .num { width: 120px; height: 30px; border: 1px solid #dcdfe6; border-radius: 4px; padding: 0 8px; font-size: 13px; background: #fff; }
  .switch { position: relative; width: 40px; height: 20px; border-radius: 10px; background: #409eff; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 22px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); }

  .card { background: #fff; border: 1px solid #e4e7ed; border-radius: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,.05); margin-bottom: 16px; }
  .card-head { display: flex; justify-content: space-between; align-items: center;
    padding: 13px 20px; border-bottom: 1px solid #ebeef5; font-weight: 600; font-size: 15px; }
  .card-head .count { color: #909399; font-weight: 400; font-size: 13px; }

  .table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .table th { text-align: left; color: #909399; font-weight: 500; padding: 10px 14px;
    border-bottom: 1px solid #ebeef5; background: #fafafa; }
  .table td { padding: 9px 14px; border-bottom: 1px solid #f0f2f5; font-variant-numeric: tabular-nums; }
  .table td.num { text-align: right; }
  .table .col-star { color: #ffb020; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
<div id="page">
  <div class="intro">
    最终版：板块设置 = <b>原生勾选框 + 9px 徽标 + 14px 文字</b>（不带股票数）；「参数设置」按钮显示与板块设置统一，
    点击后仍展开<b>原有内嵌面板</b>（与现网一致，不做弹层）。纯前端过滤，不传后端。
  </div>

  <div class="toolbar">
    <nav class="nav-underline">
      <a class="on">全市场</a><a>我的自选</a>
    </nav>
    <div class="selector-row">
      <input class="search" placeholder="代码 / 名称筛选">
      <div class="pop-wrap">
        <button class="btn btn-plain" onclick="togglePop()">板块设置</button>
        <div class="pop" id="boardPop" hidden>
          <div class="pop-head">显示板块 <span class="quick" onclick="toggleAll()">全选/清空</span></div>
          <div class="opt" data-bt="0"><input type="checkbox"><span class="x-badge x-0">沪</span>上交所主板</div>
          <div class="opt" data-bt="1"><input type="checkbox"><span class="x-badge x-1">科</span>科创板</div>
          <div class="opt" data-bt="2"><input type="checkbox"><span class="x-badge x-2">创</span>创业板</div>
          <div class="opt" data-bt="3"><input type="checkbox"><span class="x-badge x-3">北</span>北交所</div>
          <div class="opt" data-bt="4"><input type="checkbox"><span class="x-badge x-4">深</span>深交所主板</div>
          <div class="empty-tip" id="boardTip" hidden>未勾选任何板块，列表将为空</div>
        </div>
      </div>
      <button class="btn btn-plain" onclick="toggleParam()">参数设置</button>
      <button class="btn btn-primary">查询</button>
    </div>

    <!-- 参数设置：点开仍为原内嵌面板（示意，与现网一致） -->
    <div class="param-panel" id="paramPanel" hidden>
      <div class="param-sec">KDJ 参数</div>
      <div class="prow"><label>N（RSV 窗口）</label><input class="num" value="9"></div>
      <div class="prow"><label>M1（K 平滑）</label><input class="num" value="3"></div>
      <div class="prow"><label>M2（D 平滑）</label><input class="num" value="3"></div>
      <div class="param-sec">信号限制项</div>
      <div class="prow"><label>上次金叉交汇上限</label><input class="num" value="20"></div>
      <div class="prow"><label>当前金叉交汇上限</label><input class="num" value="50"></div>
      <div class="prow"><label>死叉交汇上限</label><input class="num" value="50"></div>
      <div class="prow"><label>金叉最小间距</label><input class="num" value="5"></div>
      <div class="prow"><label>金叉最大间距</label><input class="num" value="15"></div>
      <div class="prow"><label>收盘价更低（开关）</label><span class="switch"></span></div>
      <div class="prow"><label>交汇点更高（开关）</label><span class="switch"></span></div>
      <div class="param-sec">其他参数</div>
      <div class="prow"><label>查询后关闭图表</label><span class="switch"></span></div>
      <div class="prow"><label>同步展示最新周期</label><span class="switch"></span></div>
      <div class="param-sec">行情口径</div>
      <div class="prow"><label>复权类型</label><span>前复权 / 后复权 / 不复权</span></div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><span>所有股票</span> <span class="count" id="allCount"></span></div>
    <table class="table"><thead><tr>
      <th style="width:44px"></th><th style="width:120px">代码</th><th style="width:110px">名称</th>
      <th>收盘价</th><th>K</th><th>D</th><th>J</th><th>交汇点</th>
    </tr></thead><tbody id="allBody"></tbody></table>
  </div>

  <div class="card">
    <div class="card-head"><span>金叉股票</span> <span class="count" id="goldCount"></span></div>
    <table class="table"><thead><tr>
      <th style="width:44px"></th><th style="width:120px">代码</th><th style="width:110px">名称</th>
      <th>收盘价</th><th>K</th><th>D</th><th>J</th><th>交汇点</th>
    </tr></thead><tbody id="goldBody"></tbody></table>
  </div>

  <div class="card">
    <div class="card-head"><span>交易位股票</span> <span class="count" id="signalCount"></span></div>
    <table class="table"><thead><tr>
      <th style="width:44px"></th><th style="width:120px">代码</th><th style="width:110px">名称</th>
      <th>收盘价</th><th>K</th><th>D</th><th>J</th><th>交汇点</th>
    </tr></thead><tbody id="signalBody"></tbody></table>
  </div>
</div>

<script>
const ALL = [
  { code: '600519', name: '贵州茅台', bt: '0', close: 1425.32, k: 72.14, d: 68.90, j: 78.62, cross: null },
  { code: '000002', name: '万科A', bt: '4', close: 9.87, k: 55.20, d: 51.44, j: 62.72, cross: null },
  { code: '688981', name: '中芯国际', bt: '1', close: 68.21, k: 48.75, d: 50.11, j: 46.03, cross: null },
  { code: '300750', name: '宁德时代', bt: '2', close: 251.40, k: 63.30, d: 59.82, j: 70.26, cross: null },
  { code: '920185', name: '贝特瑞', bt: '3', close: 21.75, k: 44.90, d: 46.35, j: 42.00, cross: null },
  { code: '601318', name: '中国平安', bt: '0', close: 52.63, k: 51.22, d: 53.10, j: 47.46, cross: null },
  { code: '000858', name: '五粮液', bt: '4', close: 128.90, k: 58.44, d: 54.20, j: 66.92, cross: null },
  { code: '830799', name: '艾融软件', bt: '3', close: 12.38, k: 60.05, d: 57.72, j: 64.71, cross: null },
  { code: '688111', name: '金山办公', bt: '1', close: 301.20, k: 52.30, d: 46.12, j: 64.66, cross: 48.71 },
  { code: '300059', name: '东方财富', bt: '2', close: 18.42, k: 61.05, d: 55.30, j: 72.55, cross: 49.10 },
  { code: '600036', name: '招商银行', bt: '0', close: 35.88, k: 66.44, d: 61.02, j: 77.28, cross: 47.66 },
  { code: '000333', name: '美的集团', bt: '4', close: 62.15, k: 54.78, d: 50.33, j: 63.68, cross: 45.92 },
  { code: '920002', name: '万达轴承', bt: '3', close: 19.66, k: 59.87, d: 57.10, j: 65.41, cross: 50.02 },
];
const GOLD = ALL.filter(s => s.cross);
const SIGNAL = GOLD.slice(0, 2);
const TEXT = { '0': '沪', '1': '科', '2': '创', '3': '北', '4': '深' };
const state = { sel: new Set(['0', '1', '2', '3', '4']) };

function badge(bt) {
  return '<span class="x-badge x-' + bt + '">' + TEXT[bt] + '</span>';
}
function rowHtml(s) {
  return '<tr><td class="col-star">☆</td><td>' + s.code + badge(s.bt) + '</td><td>' + s.name + '</td>'
    + '<td class="num">' + s.close.toFixed(2) + '</td><td class="num">' + s.k.toFixed(2) + '</td>'
    + '<td class="num">' + s.d.toFixed(2) + '</td><td class="num">' + s.j.toFixed(2) + '</td>'
    + '<td class="num">' + (s.cross == null ? '—' : s.cross.toFixed(2)) + '</td></tr>';
}
function filtered(list) {
  return state.sel.size === 5 ? list : list.filter(s => state.sel.has(s.bt));
}
function render() {
  const all = filtered(ALL), gold = filtered(GOLD), sig = filtered(SIGNAL);
  document.getElementById('allCount').textContent = '共 ' + all.length + ' 只';
  document.getElementById('goldCount').textContent = '共 ' + gold.length + ' 只';
  document.getElementById('signalCount').textContent = '共 ' + sig.length + ' 只';
  document.getElementById('allBody').innerHTML = all.map(rowHtml).join('');
  document.getElementById('goldBody').innerHTML = gold.map(rowHtml).join('');
  document.getElementById('signalBody').innerHTML = sig.map(rowHtml).join('');
  document.querySelectorAll('#boardPop .opt').forEach(o => {
    o.querySelector('input').checked = state.sel.has(o.dataset.bt);
  });
  document.getElementById('boardTip').hidden = state.sel.size > 0;
}
function togglePop() {
  document.getElementById('boardPop').hidden = !document.getElementById('boardPop').hidden;
}
function toggleParam() {
  document.getElementById('paramPanel').hidden = !document.getElementById('paramPanel').hidden;
}
function toggleAll() {
  state.sel = state.sel.size === 5 ? new Set() : new Set(['0', '1', '2', '3', '4']);
  render();
}
document.addEventListener('click', e => {
  const opt = e.target.closest('#boardPop .opt');
  if (opt) {
    state.sel.has(opt.dataset.bt) ? state.sel.delete(opt.dataset.bt) : state.sel.add(opt.dataset.bt);
    render();
  }
  if (!e.target.closest('.pop-wrap') && !e.target.closest('#boardPop')) {
    document.getElementById('boardPop').hidden = true;
  }
});
render();
</script>
</body>
</html>
