<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>导航风格原型 D1/D2/D3 — 交易位信号系统</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="../../src/main/resources/static/vendor/index.css">
  <link rel="stylesheet" href="../../src/main/resources/static/css/style.css">
  <!-- 原型新增样式 -->
  <style>
    .fav-star { cursor: pointer; font-size: 15px; color: #c8d8ea; user-select: none; }
    .fav-star:hover { transform: scale(1.2); display: inline-block; }
    .fav-star.on { color: #ffb020; }
    .search-box { margin-left: auto; }

    /* D1：下划线文字 tab（Linear/Vercel 风） */
    .nav-row { margin-bottom: 12px; }
    .nav-underline { display: flex; justify-content: center; gap: 36px; border-bottom: 1px solid #e4ebf3; padding-bottom: 0; }
    .query-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #ffb020; margin-left: 5px; vertical-align: middle; }
    .nav-underline a { position: relative; padding: 6px 2px 10px; font-size: 15px; color: #7a93b0; cursor: pointer; }
    .nav-underline a.on { color: #1a3a5c; font-weight: 600; }
    .nav-underline a.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: #2b8fe8; border-radius: 2px; }
    .nav-underline .cnt, .nav-links .cnt { display: inline-block; margin-left: 5px; font-size: 11px; color: #fff; background: #ffb020; border-radius: 9px; padding: 0 6px; line-height: 17px; }
    .nav-underline a.on .cnt { background: #2b8fe8; }

    /* D2：Apple 大标题 + 次级文字链 */
    .nav-d2 { display: flex; align-items: baseline; gap: 20px; }
    .nav-title { font-size: 24px; font-weight: 600; color: #1d2733; letter-spacing: .5px; }
    .nav-links { display: flex; gap: 18px; }
    .nav-links a { font-size: 13px; color: #8ba1b8; cursor: pointer; padding-bottom: 2px; border-bottom: 1px solid transparent; }
    .nav-links a:hover { color: #2b8fe8; }
    .nav-links a.on { color: #2b8fe8; border-bottom-color: #2b8fe8; }

    /* D3：左侧竖排导航 */
    .side-nav { position: fixed; left: 0; top: 0; bottom: 0; width: 148px; background: #fff;
      border-right: 1px solid #e8eef5; padding: 20px 12px; z-index: 100; }
    .side-nav .logo { font-size: 13px; font-weight: 600; color: #1a3a5c; margin: 0 8px 18px; letter-spacing: 1px; }
    .side-nav a { display: flex; align-items: center; gap: 8px; padding: 10px 12px; margin-bottom: 4px;
      border-radius: 8px; font-size: 14px; color: #5a7a9d; cursor: pointer; }
    .side-nav a:hover { background: #f4f9ff; }
    .side-nav a.on { background: #e3f0fd; color: #2b8fe8; font-weight: 600; }
    .side-nav .cnt { margin-left: auto; font-size: 11px; color: #fff; background: #ffb020; border-radius: 9px; padding: 0 6px; line-height: 17px; }
    .side-nav a.on .cnt { background: #2b8fe8; }
    body.has-sidenav { padding-left: 164px; }

    /* 原型切换条 */
    .proto-bar { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 10000;
      display: flex; align-items: center; gap: 14px; padding: 8px 16px; border-radius: 999px;
      background: #16283c; color: #cfe3f7; font-size: 13px; box-shadow: 0 8px 30px rgba(10,30,60,.35); }
    .proto-bar button { background: #26405c; color: #cfe3f7; width: 28px; height: 28px; border-radius: 50%; font-size: 15px; border: none; cursor: pointer; }
    .proto-bar .name { min-width: 220px; text-align: center; }
  </style>
</head>
<body>
<div id="app">
  <!-- 认证遮罩：默认登录页（用户名+密码 / 访问密钥），「立即注册」切注册页，注册成功跳回登录 -->
  <div v-if="!authed" class="auth-overlay">
    <div class="auth-toast" v-if="toast.text" :class="toast.type">{{ toast.text }}</div>
    <div class="auth-card">
      <div class="auth-logo">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none">
          <path d="M12 2l2.4 7.2H22l-6 4.6 2.3 7.2-6.3-4.5-6.3 4.5L8 13.8l-6-4.6h7.6z" fill="#3b9eff"/>
        </svg>
      </div>
      <div class="auth-title">交易位信号系统</div>
      <div class="auth-sub">TRADE SIGNAL</div>

      <!-- 登录页 -->
      <template v-if="authView === 'login'">
        <template v-if="!useKey">
          <div class="auth-field"><input v-model="loginForm.username" placeholder="用户名" autocomplete="off" :disabled="authLoading" @keyup.enter="login"></div>
          <div class="auth-field"><input v-model="loginForm.password" type="password" placeholder="密码" :disabled="authLoading" @keyup.enter="login"></div>
        </template>
        <div v-else class="auth-field"><input v-model="authKey" type="password" placeholder="请输入访问密钥" :disabled="authLoading" @keyup.enter="login"></div>
        <button class="auth-btn" :disabled="authLoading" @click="login">{{ authLoading ? '登录中…' : '进 入' }}</button>
        <div class="auth-switch">
          <template v-if="!useKey">还没有账号？<a @click="authView = 'register'">立即注册</a> · <a @click="useKey = true">访问密钥</a></template>
          <a v-else @click="useKey = false">使用用户名登录</a>
        </div>
      </template>

      <!-- 注册页 -->
      <template v-else>
        <div class="auth-field"><input v-model="registerForm.username" placeholder="用户名（3-20 位字母/数字/下划线）" autocomplete="off" :disabled="authLoading" @keyup.enter="register"></div>
        <div class="auth-field"><input v-model="registerForm.password" type="password" placeholder="密码（8-64 位）" :disabled="authLoading" @keyup.enter="register"></div>
        <div class="auth-field"><input v-model="registerForm.inviteCode" placeholder="邀请码" autocomplete="off" :disabled="authLoading" @keyup.enter="register"></div>
        <button class="auth-btn" :disabled="authLoading" @click="register">{{ authLoading ? '注册中…' : '注 册' }}</button>
        <div class="auth-switch">已有账号？<a @click="authView = 'login'">返回登录</a></div>
      </template>
    </div>
  </div>

  <!-- D3 侧边导航 -->
  <div v-if="tbVariant === 'D3'" class="side-nav">
    <div class="logo">交易位信号</div>
    <a :class="{on: page === 'all'}" @click="switchPage('all')">◆ 全市场</a>
    <a :class="{on: page === 'fav'}" @click="switchPage('fav')">★ 我的自选<span class="cnt">{{ favs.length }}</span></a>
  </div>

  <!-- 顶部工具区 -->
  <div class="toolbar">
    <!-- 【原型新增】页签：全市场 / 我的自选（D1/D2 横排，D3 见左侧导航） -->
    <div v-if="tbVariant !== 'D3'" class="nav-row" :class="'nav-' + tbVariant.toLowerCase()">
      <template v-if="tbVariant === 'D2'">
        <span class="nav-title">{{ page === 'fav' ? '我的自选' : '全市场' }}</span>
        <nav class="nav-links">
          <a :class="{on: page === 'all'}" @click="switchPage('all')">全市场</a>
          <a :class="{on: page === 'fav'}" @click="switchPage('fav')">我的自选<span class="cnt">{{ favs.length }}</span></a>
        </nav>
      </template>
      <nav v-else class="nav-underline">
        <a :class="{on: page === 'all'}" @click="switchPage('all')">全市场</a>
        <a :class="{on: page === 'fav'}" @click="switchPage('fav')">我的自选<span class="cnt">{{ favs.length }}</span></a>
      </nav>
    </div>
    <div class="period-btns">
      <el-radio-group v-model="kdjType" size="large">
        <el-radio-button value="0">日线</el-radio-button>
        <el-radio-button value="1">周线</el-radio-button>
        <el-radio-button value="2">月线</el-radio-button>
        <el-radio-button value="3">季线</el-radio-button>
      </el-radio-group>
    </div>

    <div class="selector-row">
      <span class="label">截止周期</span>

      <el-date-picker
        v-if="kdjType === '0'"
        v-model="dailyDate"
        type="date"
        format="YYYY/MM/DD"
        value-format="YYYYMMDD"
        placeholder="选择交易日"
        :disabled-date="isNotTradeDate"
        :clearable="false"
      ></el-date-picker>

      <el-select v-if="kdjType === '1'" v-model="weekValue" placeholder="选择周" style="width: 280px">
        <el-option
          v-for="w in periods"
          :key="w.tradeDateMin"
          :label="fmtSlash(w.tradeDateMin) + ' - ' + fmtSlash(w.tradeDateMax)"
          :value="w.tradeDateMin + '-' + w.tradeDateMax"
        ></el-option>
      </el-select>

      <el-date-picker
        v-if="kdjType === '2'"
        v-model="monthValue"
        type="month"
        format="YYYY/MM"
        value-format="YYYYMM"
        placeholder="选择月份"
        :disabled-date="monthDisabled"
        :clearable="false"
      ></el-date-picker>

      <template v-if="kdjType === '3'">
        <el-select v-model="quarterYear" placeholder="年份" style="width: 120px">
          <el-option v-for="y in yearOptions" :key="y" :label="y + '年'" :value="y"></el-option>
        </el-select>
        <el-radio-group v-model="quarter">
          <el-radio-button value="1" :disabled="quarterDisabled(1)">第一季度</el-radio-button>
          <el-radio-button value="2" :disabled="quarterDisabled(2)">第二季度</el-radio-button>
          <el-radio-button value="3" :disabled="quarterDisabled(3)">第三季度</el-radio-button>
          <el-radio-button value="4" :disabled="quarterDisabled(4)">第四季度</el-radio-button>
        </el-radio-group>
      </template>

      <!-- 【原型新增】code / 名称筛选（挪到截止周期与参数设置之间；本地过滤不发请求） -->
      <el-input v-model="searchKw" placeholder="代码 / 名称筛选" clearable style="width: 200px"></el-input>
      <el-button type="primary" plain icon="Setting" @click="paramOpen = !paramOpen">
        参数设置
      </el-button>
      <el-button type="primary" icon="Search" :loading="querying" @click="loadLists">查询<span v-if="queryDirty" class="query-dot"></span></el-button>
    </div>

    <!-- 参数面板：内嵌展开，非弹窗；默认值与后端一致 -->
    <el-collapse-transition>
      <div v-show="paramOpen" class="param-panel">
        <el-form inline label-width="170px" size="default">
          <el-divider content-position="left">KDJ 参数</el-divider>
          <el-form-item label="N（RSV 窗口）">
            <el-input-number v-model="params.n" :min="1" style="width: 140px"></el-input-number>
          </el-form-item>
          <el-form-item label="M1（K 平滑）">
            <el-input-number v-model="params.m1" :min="1" style="width: 140px"></el-input-number>
          </el-form-item>
          <el-form-item label="M2（D 平滑）">
            <el-input-number v-model="params.m2" :min="1" style="width: 140px"></el-input-number>
          </el-form-item>

          <el-divider content-position="left">信号限制项</el-divider>
          <el-form-item label="上次金叉交汇上限">
            <el-input-number v-model="params.lastGoldCrossMax" style="width: 140px"></el-input-number>
          </el-form-item>
          <el-form-item label="当前金叉交汇上限">
            <el-input-number v-model="params.currGoldCrossMax" style="width: 140px"></el-input-number>
          </el-form-item>
          <el-form-item label="死叉交汇上限">
            <el-input-number v-model="params.lastDeathCrossMax" style="width: 140px"></el-input-number>
          </el-form-item>
          <el-form-item label="金叉最小间距">
            <el-input-number v-model="params.goldInternalMin" :min="1" style="width: 140px"></el-input-number>
          </el-form-item>
          <el-form-item label="金叉最大间距">
            <el-input-number v-model="params.goldInternalMax" :min="1" style="width: 140px"></el-input-number>
          </el-form-item>
          <el-form-item label="收盘价更低（开关）">
            <el-switch v-model="params.openClosePriceLimit"></el-switch>
          </el-form-item>
          <el-form-item label="交汇点更高（开关）">
            <el-switch v-model="params.goldCrossLimit"></el-switch>
          </el-form-item>

          <el-divider content-position="left">行情口径</el-divider>
          <el-form-item label="复权类型">
            <el-radio-group v-model="params.adjust">
              <el-radio-button value="1">前复权</el-radio-button>
              <el-radio-button value="2">后复权</el-radio-button>
              <el-radio-button value="0">不复权</el-radio-button>
            </el-radio-group>
          </el-form-item>
        </el-form>
      </div>
    </el-collapse-transition>
  </div>

  <!-- 所有股票：始终展示全部列（无列设置），min-width 自适应填满整行 -->
  <el-card class="all-card" shadow="never" v-loading="loadingAll">
    <template #header>
      <div class="card-head">
        <span>{{ page === 'fav' ? '我的自选' : '所有股票' }}（{{ viewAllStockList.length }}）</span>
      </div>
    </template>
    <el-table ref="allTable" :data="pagedAllStockList" size="small" highlight-current-row
              height="420"
              @current-change="row => onSelect(row, 'all')"
              :row-class-name="() => 'clickable-row'">
      <el-table-column width="46" align="center">
        <template #default="scope">
          <span class="fav-star" :class="{on: isFav(scope.row.code)}" @click.stop="toggleFav(scope.row.code)">{{ isFav(scope.row.code) ? '★' : '☆' }}</span>
        </template>
      </el-table-column>
      <el-table-column v-for="col in allColumns" :key="col.prop"
                       :prop="col.prop" :label="col.label" :min-width="col.minWidth"
                       :formatter="col.fmt ? fmtNum : undefined"
                       :align="col.prop === 'code' || col.prop === 'name' ? 'left' : 'right'"></el-table-column>
    </el-table>
    <el-pagination class="all-pager" v-model:current-page="allPage" v-model:page-size="allPageSize"
                   :total="viewAllStockList.length" :page-sizes="[50, 100, 200]"
                   layout="total, sizes, prev, pager, next, jumper" background small></el-pagination>
  </el-card>

  <!-- 金叉 / 交易位 两个列表：列可勾选；三表选中互斥 -->
  <div class="lists">
    <el-card class="list-card" shadow="never" v-loading="loadingGold">
      <template #header>
        <div class="card-head">
          <span>金叉股票（{{ viewGoldCrossList.length }}）</span>
          <el-popover placement="bottom-end" :width="160" trigger="click">
            <template #reference>
              <el-button size="small" text icon="Operation">列设置</el-button>
            </template>
            <el-checkbox-group v-model="goldCols" class="col-checks">
              <el-checkbox v-for="c in allColumns" :key="c.prop" :value="c.prop">{{ c.label }}</el-checkbox>
            </el-checkbox-group>
          </el-popover>
        </div>
      </template>
      <el-table ref="goldTable" :data="viewGoldCrossList" size="small" highlight-current-row
                height="300"
                @current-change="row => onSelect(row, 'gold')"
                :row-class-name="() => 'clickable-row'">
        <el-table-column width="46" align="center">
          <template #default="scope">
            <span class="fav-star" :class="{on: isFav(scope.row.code)}" @click.stop="toggleFav(scope.row.code)">{{ isFav(scope.row.code) ? '★' : '☆' }}</span>
          </template>
        </el-table-column>
        <el-table-column v-for="col in visibleGoldCols" :key="col.prop"
                         :prop="col.prop" :label="col.label" :width="col.width"
                         :formatter="col.fmt ? fmtNum : undefined"
                         :align="col.prop === 'code' || col.prop === 'name' ? 'left' : 'right'"></el-table-column>
      </el-table>
    </el-card>

    <el-card class="list-card" shadow="never" v-loading="loadingSignal">
      <template #header>
        <div class="card-head">
          <span>交易位股票（{{ viewTradeSignalList.length }}）</span>
          <el-popover placement="bottom-end" :width="160" trigger="click">
            <template #reference>
              <el-button size="small" text icon="Operation">列设置</el-button>
            </template>
            <el-checkbox-group v-model="signalCols" class="col-checks">
              <el-checkbox v-for="c in allColumns" :key="c.prop" :value="c.prop">{{ c.label }}</el-checkbox>
            </el-checkbox-group>
          </el-popover>
        </div>
      </template>
      <el-table ref="signalTable" :data="viewTradeSignalList" size="small" highlight-current-row
                height="300"
                @current-change="row => onSelect(row, 'signal')"
                :row-class-name="() => 'clickable-row'">
        <el-table-column width="46" align="center">
          <template #default="scope">
            <span class="fav-star" :class="{on: isFav(scope.row.code)}" @click.stop="toggleFav(scope.row.code)">{{ isFav(scope.row.code) ? '★' : '☆' }}</span>
          </template>
        </el-table-column>
        <el-table-column v-for="col in visibleSignalCols" :key="col.prop"
                         :prop="col.prop" :label="col.label" :width="col.width"
                         :formatter="col.fmt ? fmtNum : undefined"
                         :align="col.prop === 'code' || col.prop === 'name' ? 'left' : 'right'"></el-table-column>
      </el-table>
    </el-card>
  </div>

  <!-- 价格走势 + KDJ 联动图 -->
  <el-card v-if="chartStock" class="chart-card" shadow="never" v-loading="loadingChart">
    <template #header>
      <div class="chart-head">
        <span>{{ chartStock.code }}<template v-if="chartStock.name">&nbsp;{{ chartStock.name }}</template>&nbsp;&nbsp;价格走势 / KDJ</span>
        <span class="period">{{ periodName }}</span>
      </div>
    </template>
    <div id="kdjChart"></div>
  </el-card>
</div>

<div class="proto-bar">
  <button onclick="tbStep(-1)">‹</button>
  <span class="name" id="tbname"></span>
  <button onclick="tbStep(1)">›</button>
</div>
<script>
  // 工具栏变体切换（原型）：?variant=D1|D2|D3 或左右方向键
  var TB_VARIANTS = { D1: 'D1 — 下划线文字 tab（Linear/Vercel）', D2: 'D2 — Apple 大标题 + 文字链', D3: 'D3 — 左侧竖排导航' };
  function tbCur() { var v = new URLSearchParams(location.search).get('variant'); return TB_VARIANTS[v] ? v : 'D1'; }
  function tbShow() {
    var v = tbCur();
    document.getElementById('tbname').textContent = TB_VARIANTS[v];
    document.body.classList.toggle('has-sidenav', v === 'D3');
    if (window.__tbVueApply) window.__tbVueApply(v);
  }
  function tbStep(d) {
    var ks = Object.keys(TB_VARIANTS), i = ks.indexOf(tbCur());
    var url = new URL(location.href); url.searchParams.set('variant', ks[(i + d + ks.length) % ks.length]);
    history.replaceState(null, '', url); tbShow();
  }
  document.addEventListener('keydown', function (e) {
    var t = document.activeElement;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
    if (e.key === 'ArrowLeft') tbStep(-1);
    if (e.key === 'ArrowRight') tbStep(1);
  });
</script>
<script src="../../src/main/resources/static/vendor/vue.global.prod.js"></script>
<script src="../../src/main/resources/static/vendor/index.full.min.js"></script>
<script src="../../src/main/resources/static/vendor/zh-cn.min.js"></script>
<script src="../../src/main/resources/static/vendor/echarts.min.js"></script>
<script src="watchlist-v2.js"></script>
</body>
</html>
