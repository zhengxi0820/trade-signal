spring:
  application:
    name: trade-signal
  datasource:
    url: jdbc:mysql://localhost:3306/trade_signal?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 凭据走环境变量，生产必须显式设置（见 SECURITY.md 2.7）；默认值仅连本机 dev 库
    # 注意：用 TRADE_SIGNAL_ 前缀，本机 shell 里 DB_* 被其他项目占用，直接复用会串库
    username: ${TRADE_SIGNAL_DB_USER:trade_signal}
    password: ${TRADE_SIGNAL_DB_PASSWORD:trade_signal}

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

trade-signal:
  auth:
    # 访问密钥，生产必须显式设置；留空则启动时生成随机密钥打印到日志（本机开发模式）
    access-key: ${TRADE_SIGNAL_ACCESS_KEY:}
    # Cookie Secure 属性：HTTPS 下必须 true（默认），仅本机 HTTP 调试可关
    secure-cookie: ${TRADE_SIGNAL_SECURE_COOKIE:true}
    # 会话时长（小时），默认 168 = 7 天
    session-hours: ${TRADE_SIGNAL_SESSION_HOURS:168}
